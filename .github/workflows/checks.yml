name: Local artifact checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: python -m pip install -e '.[test]'
      - run: python scripts/smoke.py
      - run: python scripts/check_core.py
      - run: python scripts/check_research.py
      - run: python scripts/recompute_results.py
      - run: python -m security_ground_truth.temporal_security.gumtree_install
      - run: python -m unittest security_ground_truth.temporal_security.test_gumtree
