[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codegraph-query"
version = "0.1.0"
description = "Graph-narrowed query funnel over recorded agent reasoning."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "codegraph-trace>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
llm = ["litellm>=1.0"]

[project.scripts]
codegraph-query = "codegraph_query.cli:main"

[tool.setuptools.packages.find]
include = ["codegraph_query*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
